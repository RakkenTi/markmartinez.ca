<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Language definition fields</title>
  <desc id="desc">A table showing the fields in a language definition and the tokenization rules they provide.</desc>
  <rect width="1400" height="900" fill="#14171a"/>

  <text x="64" y="92" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="30" fill="#939ba3">LANGUAGE DEFINITION</text>
  <text x="64" y="148" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#575d63">The data that Tohki uses to define a language (rust example).</text>

  <rect x="64" y="208" width="1272" height="536" fill="#191d21" stroke="#272c31"/>
  <rect x="64" y="208" width="1272" height="72" fill="#20262b"/>
  <line x1="420" y1="208" x2="420" y2="744" stroke="#272c31"/>
  <line x1="760" y1="208" x2="760" y2="744" stroke="#272c31"/>

  <text x="104" y="254" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">FIELD</text>
  <text x="460" y="254" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">EXAMPLE</text>
  <text x="800" y="254" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">DESCRIPTION</text>

  <line x1="64" y1="280" x2="1336" y2="280" stroke="#272c31"/>
  <line x1="64" y1="346" x2="1336" y2="346" stroke="#272c31"/>
  <line x1="64" y1="412" x2="1336" y2="412" stroke="#272c31"/>
  <line x1="64" y1="478" x2="1336" y2="478" stroke="#272c31"/>
  <line x1="64" y1="544" x2="1336" y2="544" stroke="#272c31"/>
  <line x1="64" y1="610" x2="1336" y2="610" stroke="#272c31"/>
  <line x1="64" y1="676" x2="1336" y2="676" stroke="#272c31"/>

  <text x="104" y="322" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#7aa2f7">names</text>
  <text x="460" y="322" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">rust, rs</text>
  <text x="800" y="322" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">language aliases</text>

  <text x="104" y="388" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#58c6b8">comments</text>
  <text x="460" y="388" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">//  ·  /* */</text>
  <text x="800" y="388" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">line and block comments</text>

  <text x="104" y="454" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e5c07b">quotes</text>
  <text x="460" y="454" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">'  "</text>
  <text x="800" y="454" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">character and string literals</text>

  <text x="104" y="520" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#f2a65a">keywords</text>
  <text x="460" y="520" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">fn  let  match</text>
  <text x="800" y="520" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">reserved words</text>

  <text x="104" y="586" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#c792ea">types</text>
  <text x="460" y="586" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">bool  String  Vec</text>
  <text x="800" y="586" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">known type names</text>

  <text x="104" y="652" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e06c75">consts</text>
  <text x="460" y="652" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">None  Some  Ok</text>
  <text x="800" y="652" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">known constant names</text>

  <text x="104" y="718" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#d19a66">attr_prefix</text>
  <text x="460" y="718" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" fill="#e4e7ea">#</text>
  <text x="800" y="718" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#939ba3">attribute syntax</text>
</svg>
